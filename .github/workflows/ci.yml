name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Xác định phần nào thay đổi. Hai job bên dưới LUÔN chạy và luôn báo trạng thái;
  # nếu phần của mình không đổi thì chỉ bỏ qua các bước và vẫn báo "qua",
  # để bật "Require status checks" (Backend, Frontend) không làm kẹt pull request.
  changes:
    name: Phát hiện thay đổi
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Bỏ qua vì backend không thay đổi
        if: needs.changes.outputs.backend != 'true'
        working-directory: .
        run: echo "Không có thay đổi trong backend/ – bỏ qua."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.backend == 'true'

      - name: Cài JDK 21 (có cache Maven)
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build và kiểm thử (Testcontainers dùng Docker có sẵn trên runner)
        if: needs.changes.outputs.backend == 'true'
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  frontend:
    name: Frontend
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Bỏ qua vì frontend không thay đổi
        if: needs.changes.outputs.frontend != 'true'
        working-directory: .
        run: echo "Không có thay đổi trong frontend/ – bỏ qua."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.frontend == 'true'

      - name: Cài Node theo .nvmrc (có cache npm)
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài thư viện
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Lint
        if: needs.changes.outputs.frontend == 'true'
        run: npm run lint

      - name: Kiểm thử
        if: needs.changes.outputs.frontend == 'true'
        run: npm test -- --run

      - name: Build
        if: needs.changes.outputs.frontend == 'true'
        run: npm run build
