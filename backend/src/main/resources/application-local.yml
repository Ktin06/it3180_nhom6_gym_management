# Profile chạy trên máy cá nhân: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Đọc biến từ file .env ở thư mục gốc repo (chạy lệnh từ thư mục backend/).
spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gym_management}
    username: ${DB_USERNAME:gym}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: false
  flyway:
    # Thêm dữ liệu mẫu cho demo (db/seed/README.md); môi trường khác chỉ chạy db/migration.
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    vn.edu.hust.nhom6.gym: DEBUG

app:
  jwt:
    # Khóa mặc định chỉ dùng khi chạy profile local trên máy cá nhân.
    secret: ${JWT_SECRET:khung-kiem-thu-jwt-secret-toi-thieu-32-ky-tu}
