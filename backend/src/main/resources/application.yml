# Cấu hình dùng chung cho mọi môi trường.
# Kết nối cơ sở dữ liệu khai báo trong application-local.yml và application-staging.yml;
# khi chạy kiểm thử, Testcontainers tự cung cấp kết nối (@ServiceConnection).
spring:
  application:
    name: gym-management
  jpa:
    # Schema chỉ tạo và sửa bằng Flyway; Hibernate chỉ kiểm tra entity khớp bảng.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

app:
  # Địa chỉ gốc của frontend để ghép liên kết đặt lại mật khẩu gửi qua email (F1, F2).
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    # Danh sách origin được gọi API, phân tách bằng dấu phẩy.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Khóa ký JWT HS256 (tối thiểu 32 byte), dùng từ F1. Không có giá trị mặc định.
    secret: ${JWT_SECRET}
  mail:
    # Người gửi email (ADR 0013). Máy cá nhân để trống địa chỉ và khóa API: email chỉ ghi ra log.
    from-address: ${MAIL_FROM_ADDRESS:}
    from-name: ${MAIL_FROM_NAME:Gym Nhom 6}
    brevo-api-key: ${BREVO_API_KEY:}
  scheduling:
    # Bật tác vụ nền (cron theo giờ Việt Nam, chạy bù khi khởi động). Kiểm thử đặt false.
    enabled: true
