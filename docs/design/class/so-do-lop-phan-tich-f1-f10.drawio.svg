<!-- semantic note -->
<rect x="65" y="1045" width="1370" height="80" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="85" y="1074" class="legend">Ghi chú: Các lớp biểu diễn khái niệm nghiệp vụ, không phải entity/controller/service cụ thể. Quan hệ được giản lược để đọc ở mức phân tích.</text><text x="85" y="1098" class="legend">User/Member/Staff liên kết theo vai trò; ClassBooking liên kết Member và ClassSession; lớp kín chỗ từ chối đặt mới (ADR 0014); Invoice/Payment và Package/Membership xem ERD.</text>
