  <rect width="1050" height="850" fill="#FFFFFF"/>

    <text x="40" y="45" class="title">Sơ đồ Use Case Phân Rã: Tác nhân Hội viên (Member)</text>
    <text x="40" y="70" class="subtitle">Phân hệ Cổng Hội viên tự phục vụ | F1, F2, F3, F7, F8, F9, F10, F15, F19</text>

    
    <g transform="translate(90,420)">
