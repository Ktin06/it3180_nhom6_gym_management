    <text x="235" y="135" class="sys-header">Ranh giới: Cổng Hội viên (Member Portal)</text>

    
    <g>
      <ellipse cx="380" cy="175" rx="95" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="380" y="165" font-size="9" fill="#64748B">«UC-F1.2»</tspan><tspan x="380" y="175">Đăng nhập bằng email\n(JWT 15 phút)</tspan></text>
    </g>
    
    <g>
      <ellipse cx="380" cy="245" rx="95" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="380" y="235" font-size="9" fill="#64748B">«UC-F2.3/2.5»</tspan><tspan x="380" y="245">Xem hồ sơ &amp; lịch sử\nchỉ số cơ thể</tspan></text>
    </g>
    
    <g>
      <ellipse cx="380" cy="315" rx="95" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="380" y="305" font-size="9" fill="#64748B">«UC-F7.1»</tspan><tspan x="380" y="315">Xem gói tập hiện có &amp;\nlịch sử tập luyện</tspan></text>
    </g>
    
    <g>
      <ellipse cx="380" cy="395" rx="100" ry="32" class="uc-el-core"/>
      <text class="uc-text-core"><tspan x="380" y="385" font-size="9" fill="#64748B">«UC-F7.2»</tspan><tspan x="380" y="395">Yêu cầu mua / gia hạn\ngói (Thanh toán tại quầy)</tspan></text>
    </g>
    
    <g>
      <ellipse cx="700" cy="395" rx="95" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="700" y="385" font-size="9" fill="#64748B">«UC-F5.4»</tspan><tspan x="700" y="395">Tạo hóa đơn PENDING\n(Tự hủy sau 3 ngày)</tspan></text>
    </g>

    
    <g>
      <ellipse cx="380" cy="480" rx="95" ry="30" class="uc-el-core"/>
      <text class="uc-text-core"><tspan x="380" y="470" font-size="9" fill="#64748B">«UC-F8.1»</tspan><tspan x="380" y="480">Đặt chỗ lớp nhóm\n(Chỉ gói TIME)</tspan></text>
    </g>
    
    <g>
      <ellipse cx="700" cy="460" rx="95" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="700" y="450" font-size="9" fill="#64748B">«UC-F8.2»</tspan><tspan x="700" y="460">Tự động vào danh sách\nchờ khi lớp đầy</tspan></text>
    </g>
    
    <g>
      <ellipse cx="700" cy="520" rx="95" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="700" y="510" font-size="9" fill="#64748B">«UC-F8.3»</tspan><tspan x="700" y="520">Hủy chỗ đặt lớp\n(Ân hạn 15 phút)</tspan></text>
    </g>

    
    <g>
      <ellipse cx="380" cy="580" rx="95" ry="30" class="uc-el-core"/>
      <text class="uc-text-core"><tspan x="380" y="570" font-size="9" fill="#64748B">«UC-F9.1»</tspan><tspan x="380" y="580">Đặt lịch tập 1-1 với PT\n(Chỉ gói PT)</tspan></text>
    </g>
    
    <g>
      <ellipse cx="700" cy="580" rx="95" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="700" y="570" font-size="9" fill="#64748B">«NF6»</tspan><tspan x="700" y="580">Kiểm tra trùng lịch &amp;\nkhóa bi quan (NF6)</tspan></text>
    </g>

    
    <g>
      <ellipse cx="380" cy="660" rx="95" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="380" y="650" font-size="9" fill="#64748B">«UC-F9.3»</tspan><tspan x="380" y="660">Xem giáo án &amp;\nnhật ký tập luyện</tspan></text>
    </g>
    
    <g>
      <ellipse cx="380" cy="730" rx="95" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="380" y="720" font-size="9" fill="#64748B">«UC-F15.1»</tspan><tspan x="380" y="730">Yêu cầu bảo lưu gói\n(Chờ quản lý duyệt)</tspan></text>
    </g>
    
    <g>
      <ellipse cx="700" cy="730" rx="95" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="700" y="720" font-size="9" fill="#64748B">«UC-F19.1»</tspan><tspan x="700" y="730">Theo dõi chuỗi ngày tập\n&amp; huy hiệu đạt được</tspan></text>
    </g>

