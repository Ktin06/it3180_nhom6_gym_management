<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1050px" height="850px" viewBox="-0.5 -0.5 1050 850" content="&lt;mxfile host=&quot;app.diagrams.net&quot; version=&quot;24.0.0&quot;&gt;
  &lt;diagram id=&quot;diag_use_case_hoi_vien&quot; name=&quot;use_case_hoi_vien&quot;&gt;
    &lt;mxGraphModel dx=&quot;1050&quot; dy=&quot;850&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; guides=&quot;1&quot; tooltips=&quot;1&quot; connect=&quot;1&quot; arrows=&quot;1&quot; fold=&quot;1&quot; page=&quot;1&quot; pageScale=&quot;1&quot; pageWidth=&quot;1050&quot; pageHeight=&quot;850&quot;&gt;
      &lt;root&gt;
