  <rect width="1100" height="900" fill="#FFFFFF"/>

    <text x="40" y="45" class="title">Sơ đồ Use Case Phân Rã: Tác nhân Lễ tân (Receptionist)</text>
    <text x="40" y="70" class="subtitle">Nghiệp vụ vận hành quầy lễ tân chi nhánh | F1, F2, F3, F4, F5, F6, F12</text>

    
    <g transform="translate(90,450)">
      <circle cx="0" cy="-22" r="13" class="actor-head"/>
      <line x1="0" y1="-9" x2="0" y2="18" class="actor-body"/>
      <line x1="-16" y1="2" x2="16" y2="2" class="actor-body"/>
      <line x1="0" y1="18" x2="-12" y2="42" class="actor-body"/>
      <line x1="0" y1="18" x2="12" y2="42" class="actor-body"/>
      <text x="0" y="58" class="actor-label">Lễ tân\n(Trực quầy)</text>
    </g>

    <rect x="210" y="100" width="850" height="770" class="sys-rect"/>
    <text x="235" y="135" class="sys-header">Ranh giới: Phân hệ Nghiệp vụ Quầy Lễ tân</text>

    
    <g>
      <ellipse cx="380" cy="180" rx="100" ry="32" class="uc-el-core"/>
      <text class="uc-text-core"><tspan x="380" y="170" font-size="9" fill="#64748B">«UC-F2.1»</tspan><tspan x="380" y="180">Tạo hồ sơ hội viên\ntại quầy (Mã HV tự sinh)</tspan></text>
    </g>
    
    <g>
      <ellipse cx="380" cy="255" rx="100" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="380" y="245" font-size="9" fill="#64748B">«UC-F2.2»</tspan><tspan x="380" y="255">Kích hoạt tài khoản cho\nhồ sơ đã có sẵn</tspan></text>
    </g>
    
    <g>
      <ellipse cx="380" cy="325" rx="100" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="380" y="315" font-size="9" fill="#64748B">«UC-F2.3»</tspan><tspan x="380" y="325">Tra cứu hồ sơ hội viên\n(Mã HV / SĐT &lt; 2s)</tspan></text>
    </g>

    
    <g>
      <ellipse cx="380" cy="420" rx="105" ry="34" class="uc-el-core"/>
      <text class="uc-text-core"><tspan x="380" y="410" font-size="9" fill="#64748B">«UC-F4.2»</tspan><tspan x="380" y="420">Check-in thủ công\ntại quầy</tspan></text>
    </g>
    
    <g>
      <ellipse cx="720" cy="350" rx="100" ry="32" class="uc-el"/>
      <text class="uc-text"><tspan x="720" y="340" font-size="9" fill="#64748B">«UC-F4.1»</tspan><tspan x="720" y="350">Đối chiếu ảnh đại diện\nchống mượn thẻ</tspan></text>
    </g>
    
    <g>
      <ellipse cx="720" cy="420" rx="105" ry="34" class="uc-el"/>
      <text class="uc-text"><tspan x="720" y="410" font-size="9" fill="#64748B">«BR-F4.2/3»</tspan><tspan x="720" y="420">Ưu tiên gói TIME; trừ 1\nbuổi nếu là gói SESSION</tspan></text>
    </g>
    
    <g>
      <ellipse cx="720" cy="490" rx="100" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="720" y="480" font-size="9" fill="#64748B">«UC-F4.3»</tspan><tspan x="720" y="490">Tự động đánh dấu đã đến\nlớp học nhóm sắp diễn ra</tspan></text>
    </g>

    
    <g>
      <ellipse cx="380" cy="520" rx="100" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="380" y="510" font-size="9" fill="#64748B">«UC-F4.4»</tspan><tspan x="380" y="520">Ghi nhận Check-out\ncho hội viên</tspan></text>
    </g>
    
    <g>
      <ellipse cx="380" cy="590" rx="100" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="380" y="580" font-size="9" fill="#64748B">«UC-F4.5»</tspan><tspan x="380" y="590">Xem nhật ký check-in\ntrong ngày</tspan></text>
    </g>

    
    <g>
      <ellipse cx="380" cy="675" rx="100" ry="32" class="uc-el-core"/>
      <text class="uc-text-core"><tspan x="380" y="665" font-size="9" fill="#64748B">«UC-F3.2»</tspan><tspan x="380" y="675">Bán &amp; gia hạn gói tập\ntại quầy</tspan></text>
    </g>
    
    <g>
      <ellipse cx="720" cy="675" rx="105" ry="34" class="uc-el-core"/>
      <text class="uc-text-core"><tspan x="720" y="665" font-size="9" fill="#64748B">«UC-F5.1»</tspan><tspan x="720" y="675">Thu tiền &amp; in hóa đơn\nVietQR / Tiền mặt</tspan></text>
    </g>
    
    <g>
      <ellipse cx="720" cy="750" rx="100" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="720" y="740" font-size="9" fill="#64748B">«UC-F5.2»</tspan><tspan x="720" y="750">Xử lý hóa đơn chờ\ntừ Cổng hội viên (F7)</tspan></text>
    </g>

    
    <g>
      <ellipse cx="380" cy="770" rx="100" ry="30" class="uc-el"/>
      <text class="uc-text"><tspan x="380" y="760" font-size="9" fill="#64748B">«UC-F12.1»</tspan><tspan x="380" y="770">Bán hàng tại quầy POS\n(Nước, phụ kiện)</tspan></text>
    </g>
    
    <g>
      <ellipse cx="380" cy="835" rx="100" ry="28" class="uc-el-core"/>
      <text class="uc-text-core"><tspan x="380" y="825" font-size="9" fill="#64748B">«UC-F6»</tspan><tspan x="380" y="835">Xem Dashboard cơ bản\n&amp; cảnh báo hết hạn</tspan></text>
    </g>

    <!-- Lines -->
    <line x1="140" y1="430" x2="280" y2="180" class="line" marker-end="url(#arr)"/>
    <line x1="140" y1="435" x2="280" y2="255" class="line" marker-end="url(#arr)"/>
